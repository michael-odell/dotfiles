# repo registry — migrated to the named-root schema (DESIGN §3.4).
#
# What changed from the old file:
#   - `[tag.*]` tables are gone; configuration now attaches to named [root.*]
#     directory nodes with a `dir`. Settings inherit down the tree by `dir`
#     prefix and are overridable per-root or per-repo.
#   - the flat/owner axis is spelled `layout` (your old file used `path`, which
#     was silently ignored — the reason vendor was never actually owner-nested).
#   - `home_root` is gone (a root's `dir` is its home).
#   - repos nest under their root: a `repos = [...]` list of bare ids for the
#     common case, `[[root.<name>.repo]]` tables for exceptions.

[defaults]
worktrees  = false
#branches   = ["main"]
prune      = "interactive"          # manual | report | interactive | auto  (§5.3)
prune_min_age = "5d"                # a landed branch whose ref moved more
                                    # recently is reported, never removed —
                                    # the one case no tier can see is work
                                    # that landed and is still being built on.
host       = "github"               # default host for bare-name clones
# push/task_branches (auto|manual|never, auto|report|disallow) default per
# workflow — upstream-push: manual/report; fork-pr: auto/auto;
# vendor/supply-chain-mirror: never/disallow. Overridable per root/repo below.
# force_push/force_pull (branch-name globs, e.g. ["wip/*"]) default to [] —
# never force in either direction unless a branch is explicitly listed.
# UNCERTAIN: forks are assumed to live under github:michael-odell. This lets
# fork-pr / supply-chain-mirror repos derive their fork automatically instead of
# stating it per repo. Change or remove if your forks live elsewhere.
fork_owner = "github:michael-odell"

[hosts.github]
base = "git@github.com:"

# ── personal repos: your own code, pushed straight to origin ──────────────────
[root.src]
dir           = "~/src"
layout        = "flat"              # ~/src/<repo>
push          = "auto"              # solo repos: push local commits, don't just report them
task_branches = "auto"              # ...including task/feature branches — no PR step for a solo repo
show_branches = "all"               # for confidence building in "pruneable"


# workflow defaults to upstream-push. Repos already cloned here are discovered
# automatically; list ids under `repos` only for ones you want provisioned on a
# fresh machine, e.g.:
# repos = [
#   "github:michael-odell/repo",
#   "github:michael-odell/homelab",
# ]

# ── vendored third-party code: pulled to a pin, never pushed ──────────────────
[root.contrib]
dir      = "~/contrib"
layout   = "owner"                  # ~/contrib/<owner>/<repo>
workflow = "vendor"
pin      = "latest-tag"
# Anything cloned under ~/contrib is discovered and treated as vendored. Add ids
# to `repos` here to have `repo` clone them for you.

# ── zsh plugins ───────────────────────────────────────────────────────────────
# UNCERTAIN: the artifact generator currently emits plugins.zsh from the root
# *named* "plugins" (a hardcoded name, flagged as a TODO in the code). Keep this
# root named "plugins" until that becomes an explicit attribute, or tell me and
# I'll wire an explicit flag instead.
[root.plugins]
dir    = "~/.zsh/plugins"
layout = "flat"
# your own plugins (upstream-push, no fork) — one line each:
# repos = [
#   "github:michael-odell/zsh-history",
# ]

# UNCERTAIN: supply-chain-mirror is unverified end-to-end because `repo review`
# isn't implemented yet, so this entry may not behave fully. It's carried over
# from your old config. The fork is derived from fork_owner
# (github:michael-odell/powerlevel10k); `branches` differs from the default, so
# it's stated. Provisioning would set up origin=fork + an `untrusted` remote.
[[root.plugins.repo]]
id       = "github:romkatv/powerlevel10k"
workflow = "supply-chain-mirror"
branches = ["master"]
expected_untracked = ["powerlevel10k.plugin.zsh"] # Created by my plugin loader

[[root.plugins.repo]]
id       = "github:zdharma-continuum/fast-syntax-highlighting"
workflow = "supply-chain-mirror"
branches = ["master"]

[[root.plugins.repo]]
id       = "github:zsh-users/zsh-completions"
workflow = "supply-chain-mirror"
branches = ["master"]
