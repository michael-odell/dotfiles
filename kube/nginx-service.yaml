apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
    - protocol: TCP
      port: 4444
      targetPort: 80
      name: http-for-4
    - protocol: TCP
      port: 5555
      targetPort: 80
      name: http-for-5
